name: CodeQL

# Analiza statyczna pod kątem bezpieczeństwa. Uzupełnia ruff (reguły S) i npm audit:
# ruff patrzy na wzorce w pliku, CodeQL na przepływ danych przez cały program —
# np. czy parametr żądania trafia do zapytania SQL.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nowe reguły i nowe podatności pojawiają się bez zmian w naszym kodzie.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analiza (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
