name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nowy push do tej samej gałęzi anuluje poprzedni przebieg — nie płacimy
# za weryfikację nieaktualnego kodu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Konwencja commitów
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Komunikaty commitów
        run: ./scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

      - name: Tytuł pull requesta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commits.sh --subject "$PR_TITLE"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: osint
          POSTGRES_DB: osint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osint"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalacja
        working-directory: backend
        run: pip install -e ".[etl,dev]"

      # --- poprawność stylu i typów ---
      - name: Ruff (lint)
        working-directory: backend
        run: ruff check src tests

      - name: Ruff (formatowanie)
        working-directory: backend
        run: ruff format --check src tests

      - name: Mypy (strict)
        working-directory: backend
        run: mypy src

      # --- poprawność zachowania ---
      - name: Testy jednostkowe z progiem pokrycia warstwy domenowej
        working-directory: backend
        run: |
          pytest tests/unit -q \
            --cov=business_osint.domain \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Migracje
        working-directory: backend
        env:
          BUSINESS_OSINT_DATABASE_URL: postgresql+asyncpg://osint:osint@localhost:5432/osint_test
        run: alembic upgrade head

      # Wyłapuje rozjazd między modelami SQLAlchemy a migracjami — bez tego
      # `alembic revision --autogenerate` zaczyna generować fantomowe operacje.
      - name: Zgodność modeli z migracjami
        working-directory: backend
        env:
          BUSINESS_OSINT_DATABASE_URL: postgresql+asyncpg://osint:osint@localhost:5432/osint_test
        run: alembic check

      - name: Testy integracyjne
        working-directory: backend
        env:
          BUSINESS_OSINT_TEST_DATABASE_URL: postgresql+asyncpg://osint:osint@localhost:5432/osint_test
        run: pytest tests/integration -q -m integration

      # --- bezpieczeństwo zależności ---
      - name: Audyt zależności
        working-directory: backend
        run: pip-audit --skip-editable

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Audyt zależności
        working-directory: frontend
        run: npm audit --audit-level=high
